<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <!-- =========================================================
       VIEWPORT
       =========================================================

       Keep this standard.

       We are NOT attempting to repair Safari's viewport with
       JavaScript anymore.

       Mobile/desktop detection is handled separately using
       screen.width.
       ========================================================= -->

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Andreo</title>


  <!-- =========================================================
       DEVICE DETECTION
       =========================================================

       IMPORTANT:

       Some iPhones can report:

           screen.width = 390
           innerWidth   = 980

       Safari then evaluates:

           @media (max-width: 768px)

       incorrectly.

       We therefore use screen.width instead.

       This adds either:

           html.is-mobile

       or:

           html.is-desktop

       to the document.

       The CSS below uses these classes instead of relying on
       Safari's potentially incorrect layout viewport.
       ========================================================= -->

  <script>

    (function () {

      function updateDeviceClass() {

        const physicalWidth =
          window.screen.width;

        const mobile =
          physicalWidth <= 768;


        document.documentElement.classList.toggle(
          "is-mobile",
          mobile
        );


        document.documentElement.classList.toggle(
          "is-desktop",
          !mobile
        );


        /*
         * DEBUGGING
         *
         * Open Safari's developer console if you want to
         * check what the device is reporting.
         *
         * Example:
         *
         * screen.width: 390
         * innerWidth: 980
         * mobile: true
         */

        console.log(
          "screen.width:",
          physicalWidth,
          "innerWidth:",
          window.innerWidth,
          "mobile:",
          mobile
        );

      }


      /*
       * Run immediately.
       */

      updateDeviceClass();


      /*
       * Run again once the page has loaded.
       */

      window.addEventListener(
        "load",
        updateDeviceClass
      );


      /*
       * Re-check if the viewport changes.
       */

      window.addEventListener(
        "resize",
        updateDeviceClass
      );


      /*
       * Re-check after orientation changes.
       */

      window.addEventListener(
        "orientationchange",
        function () {

          setTimeout(
            updateDeviceClass,
            100
          );

        }
      );

    })();

  </script>


  <style>


    /* =========================================================
       EASY EDITING — GLOBAL SETTINGS
       ========================================================= */


    :root {


      /* -------------------------------------------------------
         GENERAL
         ------------------------------------------------------- */

      --background:
        #f5f3ee;

      --text:
        #111111;


      /* -------------------------------------------------------
         SELECTED MENU ITEM — BLUE
         -------------------------------------------------------

         CHANGE THIS HEX VALUE TO CHANGE THE BLUE RHOMBUS.
         ------------------------------------------------------- */

      --menu-active-blue:
        #d3e4f1;

      --menu-active-text:
        #111111;


      /* -------------------------------------------------------
         TITLE
         ------------------------------------------------------- */

      --title-size-desktop:
        clamp(12rem, 34vw, 38rem);

      --title-size-mobile:
        clamp(7rem, 34vw, 21rem);


      --title-bottom-desktop:
        1.5rem;

      --title-bottom-mobile:
        4rem;


      /* -------------------------------------------------------
         MENU
         ------------------------------------------------------- */

      --menu-size:
        2.1rem;

      --menu-spacing:
        0.6rem;


      /*
        MENU PADDING
      */

      --menu-padding-vertical:
        0.4rem;

      --menu-padding-horizontal:
        1.8rem;


      /*
        RHOMBUS ANGLE
      */

      --menu-rhombus-angle:
        0.45rem;


      /* -------------------------------------------------------
         DESKTOP CONTENT
         ------------------------------------------------------- */

      --desktop-content-padding-top:
        0rem;

      --desktop-content-padding-right:
        2rem;

      --desktop-content-padding-bottom:
        8rem;

      --desktop-content-padding-left:
        4rem;

      --desktop-content-size:
        clamp(1.2rem, 2.2vw, 2rem);


      /* -------------------------------------------------------
         MOBILE CONTENT
         ------------------------------------------------------- */

      --mobile-content-padding-top:
        8rem;

      --mobile-content-padding-right:
        1.5rem;

      --mobile-content-padding-bottom:
        5rem;

      --mobile-content-padding-left:
        1.5rem;

      --mobile-content-size:
        4rem;


      /* -------------------------------------------------------
         ANIMATION
         ------------------------------------------------------- */

      --menu-transition:
        650ms cubic-bezier(.77, 0, .175, 1);

      --content-transition:
        700ms ease;

      --menu-return-fade:
        700ms ease;

    }


    /* =========================================================
       RESET
       ========================================================= */

    * {

      box-sizing:
        border-box;

    }


    html,
    body {

      margin:
        0;

      width:
        100%;

      height:
        100%;

    }


    body {

      background:
        var(--background);

      color:
        var(--text);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow:
        hidden;

    }


    /* =========================================================
       PAGE
       ========================================================= */

    .page {

      position:
        relative;

      width:
        100%;

      height:
        100svh;

      overflow:
        hidden;

    }


    /* =========================================================
       CONTENT PAGE
       =========================================================

       DESKTOP:

       Content fades in.

       MOBILE:

       Content slides in from the right.

       The content layer sits underneath the menu and title.
       ========================================================= */

    .content-page {

      position:
        absolute;

      inset:
        0;

      width:
        100%;

      max-width:
        100%;

      height:
        100%;

      overflow-y:
        auto;

      overflow-x:
        hidden;

      padding:
        var(--desktop-content-padding-top)
        var(--desktop-content-padding-right)
        var(--desktop-content-padding-bottom)
        var(--desktop-content-padding-left);

      opacity:
        0;

      visibility:
        hidden;

      pointer-events:
        none;

      z-index:
        10;

      transition:
        opacity var(--content-transition),
        visibility var(--content-transition);

    }


    /* =========================================================
       ACTIVE CONTENT
       ========================================================= */

    .content-page.active {

      opacity:
        1;

      visibility:
        visible;

      pointer-events:
        auto;

    }


    /* =========================================================
       CONTENT WIDTH
       ========================================================= */

    .content-inner {

      width:
        100%;

      max-width:
        100%;

      overflow-wrap:
        break-word;

      word-wrap:
        break-word;

      font-size:
        var(--desktop-content-size);

      line-height:
        1.4;

    }


    .content-inner img,
    .content-inner video,
    .content-inner iframe {

      max-width:
        100%;

      height:
        auto;

    }


    /* =========================================================
       MENU
       ========================================================= */

    .menu {

      position:
        absolute;

      bottom:
        calc(
          var(--title-bottom-desktop) +
          var(--title-size-desktop) * 0.72 +
          1.4rem
        );

      left:
        50%;

      transform:
        translateX(-50%);

      display:
        flex;

      gap:
        var(--menu-spacing);

      z-index:
        30;

      transition:
        transform var(--menu-transition),
        opacity var(--menu-transition);

    }


    /* =========================================================
       MENU BUTTON
       ========================================================= */

    .menu button {

      position:
        relative;

      appearance:
        none;

      border:
        0;

      background:
        transparent;

      padding:
        var(--menu-padding-vertical)
        var(--menu-padding-horizontal);

      margin:
        0;

      color:
        var(--text);

      font:
        inherit;

      font-size:
        var(--menu-size);

      line-height:
        1.2;

      cursor:
        pointer;

      transition:
        color 250ms ease,
        transform 250ms ease;

    }


    .menu button:hover {

      transform:
        translateY(-2px);

    }


    /* =========================================================
       SELECTED MENU ITEM — RHOMBUS
       ========================================================= */

    .menu button::before {

      content:
        "";

      position:
        absolute;

      z-index:
        -1;

      top:
        0;

      right:
        0;

      bottom:
        0;

      left:
        0;

      /*
       * =======================================================
       * CHANGE BLUE HERE
       * =======================================================
       */

      background:
        var(--menu-active-blue);

      clip-path:
        polygon(
          var(--menu-rhombus-angle) 0%,
          100% 0%,
          calc(100% - var(--menu-rhombus-angle)) 100%,
          0% 100%
        );

      opacity:
        0;

      transition:
        opacity 250ms ease;

    }


    .menu button.selected {

      color:
        var(--menu-active-text);

    }


    .menu button.selected::before {

      opacity:
        1;

    }


    /* =========================================================
       TITLE
       ========================================================= */

    .title {

      position:
        absolute;

      left:
        50%;

      bottom:
        var(--title-bottom-desktop);

      transform:
        translateX(-50%)
        scaleX(1.10);

      transform-origin:
        center bottom;

      margin:
        0;

      font-size:
        var(--title-size-desktop);

      line-height:
        0.72;

      font-weight:
        900;

      font-style:
        italic;

      letter-spacing:
        -0.06em;

      white-space:
        nowrap;

      z-index:
        30;

      user-select:
        none;

      pointer-events:
        none;

    }


    /* =========================================================
       BACK ARROW
       =========================================================

       Hidden on desktop.
       ========================================================= */

    .back-button {

      display:
        none;

      appearance:
        none;

      border:
        0;

      background:
        transparent;

      color:
        var(--text);

      padding:
        0;

      margin:
        0 0 2rem 0;

      font:
        inherit;

      font-size:
        1.3rem;

      line-height:
        1;

      cursor:
        pointer;

    }


    /* =========================================================
       MOBILE
       =========================================================

       IMPORTANT:

       We deliberately DO NOT use:

           @media (max-width: 768px)

       Safari may be reporting a 980px layout viewport.

       Instead we use:

           html.is-mobile

       which is determined from screen.width.
       ========================================================= */


    html.is-mobile .menu {

      top:
        1.5rem;

      left:
        0.3rem;

      bottom:
        auto;

      transform:
        translateX(0);

      display:
        flex;

      flex-direction:
        column;

      gap:
        1.5rem;

      align-items:
        flex-start;

      transition:
        transform var(--menu-transition),
        opacity var(--menu-transition);

    }


    html.is-mobile .menu button {

      font-size:
        4rem;

      padding:
        var(--menu-padding-vertical)
        var(--menu-padding-horizontal);

    }


    /* ---------------------------------------------------------
       MOBILE — NO BLUE RHOMBUS
       --------------------------------------------------------- */

    html.is-mobile .menu button.selected {

      color:
        var(--text);

    }


    html.is-mobile .menu button.selected::before {

      opacity:
        0;

    }


    /* =========================================================
       MOBILE MENU — LEAVE LEFT
       ========================================================= */

    html.is-mobile .menu.mobile-hidden {

      transform:
        translateX(
          calc(-100vw - 2rem)
        );

      opacity:
        0;

      pointer-events:
        none;

    }


    /* =========================================================
       MOBILE MENU — FADE BACK IN
       ========================================================= */

    html.is-mobile .menu.menu-fading-in {

      transform:
        translateX(0);

      opacity:
        0;

      pointer-events:
        none;

      transition:
        opacity var(--menu-return-fade);

    }


    /* =========================================================
       MOBILE TITLE
       ========================================================= */

    html.is-mobile .title {

      left:
        50%;

      bottom:
        var(--title-bottom-mobile);

      transform:
        translateX(-50%)
        scaleX(1.10);

      transform-origin:
        center bottom;

      font-size:
        var(--title-size-mobile);

      line-height:
        0.72;

      letter-spacing:
        -0.06em;

    }


    /* =========================================================
       MOBILE CONTENT PAGE
       ========================================================= */

    html.is-mobile .content-page {

      position:
        absolute;

      inset:
        0;

      width:
        100%;

      max-width:
        100%;

      height:
        100%;

      overflow-y:
        auto;

      overflow-x:
        hidden;

      padding:
        var(--mobile-content-padding-top)
        var(--mobile-content-padding-right)
        var(--mobile-content-padding-bottom)
        var(--mobile-content-padding-left);

      /*
       * INITIAL POSITION:
       * outside viewport on RIGHT.
       */

      transform:
        translateX(100%);

      opacity:
        0;

      visibility:
        hidden;

      pointer-events:
        none;

      z-index:
        20;

      transition:
        transform 700ms
        cubic-bezier(.77, 0, .175, 1),

        opacity 1000ms ease,

        visibility 700ms ease;

    }


    /* =========================================================
       MOBILE CONTENT — ENTER
       ========================================================= */

    html.is-mobile .content-page.active {

      transform:
        translateX(0);

      opacity:
        1;

      visibility:
        visible;

      pointer-events:
        auto;

    }


    /* =========================================================
       MOBILE CONTENT — LEAVE LEFT
       ========================================================= */

    html.is-mobile .content-page.leaving-left {

      transform:
        translateX(-100%);

      opacity:
        0;

      visibility:
        visible;

      pointer-events:
        none;

      transition:
        transform 650ms
        cubic-bezier(.77, 0, .175, 1),

        opacity 650ms ease;

    }


    /* =========================================================
       MOBILE CONTENT INNER
       ========================================================= */

    html.is-mobile .content-inner {

      width:
        100%;

      max-width:
        100%;

      overflow-wrap:
        break-word;

      word-wrap:
        break-word;

      font-size:
        var(--mobile-content-size);

      line-height:
        1.5;

    }


    html.is-mobile .content-inner img,
    html.is-mobile .content-inner video,
    html.is-mobile .content-inner iframe {

      max-width:
        100%;

      height:
        auto;

    }


    /* =========================================================
       MOBILE BACK ARROW
       ========================================================= */

    html.is-mobile .back-button {

      display:
        block;

      margin:
        0 0 2rem 0;

      font-size:
        1.3rem;

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        transition-duration:
          0.01ms !important;

      }

    }


  </style>

</head>


<body>


  <main class="page">


    <!-- =======================================================
         CONTENT PAGE
         ======================================================= -->

    <section
      class="content-page"
      id="contentPage"
    >

      <div class="content-inner">


        <!-- ===================================================
             MOBILE BACK ARROW

             Hidden on desktop.
             =================================================== -->

        <button
          class="back-button"
          id="backButton"
          aria-label="Return to menu"
        >
          ←
        </button>


        <!-- ===================================================
             SELECTED CONTENT
             =================================================== -->

        <div id="content"></div>


      </div>

    </section>


    <!-- =======================================================
         MENU
         ======================================================= -->

    <nav
      class="menu"
      id="menu"
    >

      <button
        data-section="about"
      >
        about
      </button>


      <button
        data-section="work"
      >
        sound
      </button>


      <button
        data-section="contact"
      >
        contact
      </button>

    </nav>


    <!-- =======================================================
         TITLE
         ======================================================= -->

    <h1 class="title">
      Andreo
    </h1>


  </main>


  <script>


    /* =========================================================
       CONTENT
       =========================================================

       Replace the text inside these sections with your actual
       website content.

       HTML is allowed.

       ========================================================= */


    const contentData = {


      /* =======================================================
         ABOUT
         ======================================================= */

      about: `

        <font color="777777">

          <p>
            Violinist on Ngunnawal country.
          </p>


          <p>
            After 15+ years experience in commercial music
            performance&mdash;from the <i>Bee Gees</i> to
            <i>The Phantom of the Opera</i> and 2 years touring
            with a
            <a
              href="https://youtu.be/fy7F1f_sO3E?si=gW0SHWK7OhuGrkbL"
              target="_blank"
              rel="noopener noreferrer"
              style="color: grey;"
            >
              pop rock band
            </a>,
            to countless corporate events and television
            appearances (inc. one for <i>Netflix</i>)&mdash;
          

          I am now
          </font>
          primarily seeking creative alignment.

          </p>


          <p>

            <font color="777777">

              Currently, my interest is in soul, rock,
              electronic, experimental, world, folk, R&amp;B
              and metal.

            </font>


            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>

          </p>

      `,


      /* =======================================================
         SOUND
         ======================================================= */

      work: `

        <p>
          <font color="777777">TBD</font>
        </p>

      `,


      /* =======================================================
         CONTACT
         ======================================================= */

      contact: `
        
        <p>
          hello@andreo.com.au
        </p>

        <font color="777777">
        <p>
          @helloandreo
        </p>
        </font>
      `

    };


    /* =========================================================
       ELEMENTS
       ========================================================= */


    const menu =
      document.getElementById(
        "menu"
      );


    const menuButtons =
      document.querySelectorAll(
        ".menu button"
      );


    const contentPage =
      document.getElementById(
        "contentPage"
      );


    const content =
      document.getElementById(
        "content"
      );


    const backButton =
      document.getElementById(
        "backButton"
      );


    /* =========================================================
       MOBILE DETECTION
       =========================================================

       IMPORTANT:

       Do NOT use:

         window.innerWidth

       or:

         matchMedia("(max-width: 768px)")

       here.

       On your iPhone Safari is reporting:

         innerWidth = 980

       while:

         screen.width = 390

       Therefore screen.width is the reliable value for
       this site's mobile/desktop decision.
       ========================================================= */


    function isMobile() {

      return window.screen.width <= 768;

    }


    /* =========================================================
       OPEN CONTENT
       ========================================================= */


    function openContent(
      section,
      selectedButton
    ) {


      /*
       * Insert requested content.
       */

      content.innerHTML =
        contentData[section];


      /* =======================================================
         DESKTOP
         ======================================================= */

      if (!isMobile()) {


        /*
         * Remove previous selection.
         */

        menuButtons.forEach(
          button => {

            button.classList.remove(
              "selected"
            );

          }
        );


        /*
         * Select clicked menu item.
         *
         * This activates the blue rhombus.
         */

        selectedButton.classList.add(
          "selected"
        );


        /*
         * Fade content in.
         */

        contentPage.classList.add(
          "active"
        );

      }


      /* =======================================================
         MOBILE
         ======================================================= */

      else {


        /*
         * Remove any previous menu-return state.
         */

        menu.classList.remove(
          "menu-fading-in"
        );


        /*
         * Menu leaves LEFT.
         */

        menu.classList.add(
          "mobile-hidden"
        );


        /*
         * Allow the menu to move out before the content
         * begins entering.
         */

        setTimeout(
          () => {

            contentPage.classList.add(
              "active"
            );

          },
          350
        );

      }

    }


    /* =========================================================
       MENU BUTTON EVENTS
       ========================================================= */


    menuButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const section =
              button.dataset.section;


            openContent(
              section,
              button
            );

          }
        );

      }
    );


    /* =========================================================
       MOBILE BACK ARROW
       =========================================================

       RETURN SEQUENCE:

       1. Content slides LEFT.
       2. Content finishes leaving.
       3. Menu returns to its normal position.
       4. Menu starts invisible.
       5. Menu fades in.

       The menu does NOT slide back in.
       ========================================================= */


    backButton.addEventListener(
      "click",
      () => {


        /*
         * Ignore the button on desktop.
         */

        if (!isMobile()) {

          return;

        }


        /* -----------------------------------------------------
           STEP 1
           Content begins leaving LEFT.
           ----------------------------------------------------- */

        contentPage.classList.add(
          "leaving-left"
        );


        /*
         * Force layout so the browser registers the starting
         * state before the transition begins.
         */

        void contentPage.offsetWidth;


        /*
         * Remove active state.

         * Because leaving-left is still present, the content
         * travels LEFT rather than returning RIGHT.
         */

        contentPage.classList.remove(
          "active"
        );


        /* -----------------------------------------------------
           STEP 2
           Wait for content to finish leaving.
           ----------------------------------------------------- */

        setTimeout(
          () => {


            /*
             * Remove the class that moved the menu LEFT.
             */

            menu.classList.remove(
              "mobile-hidden"
            );


            /*
             * Put the menu back in its normal position,
             * but make it invisible.
             */

            menu.classList.add(
              "menu-fading-in"
            );


            /*
             * Force layout so the browser registers:
             *
             * opacity: 0
             *
             * at the normal menu position.
             */

            void menu.offsetWidth;


            /*
             * Remove the fading class.
             *
             * This causes:
             *
             * opacity 0 → 1
             *
             * while the menu remains stationary.
             */

            menu.classList.remove(
              "menu-fading-in"
            );


            /*
             * Clean up the temporary content state.
             */

            contentPage.classList.remove(
              "leaving-left"
            );


          },
          650
        );

      }
    );


    /* =========================================================
       WINDOW RESIZE
       =========================================================

       Reset the interface if the device changes orientation
       or moves between mobile/desktop dimensions.
       ========================================================= */


    window.addEventListener(
      "resize",
      () => {


        /*
         * Reset content.
         */

        contentPage.classList.remove(
          "active"
        );


        contentPage.classList.remove(
          "leaving-left"
        );


        /*
         * Reset menu.
         */

        menu.classList.remove(
          "mobile-hidden"
        );


        menu.classList.remove(
          "menu-fading-in"
        );


        /*
         * Reset selected state.
         */

        menuButtons.forEach(
          button => {

            button.classList.remove(
              "selected"
            );

          }
        );

      }
    );


  </script>


</body>

</html>
