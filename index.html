<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Viewport Test</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .mobile {
      display: none;
    }

    @media (max-width: 768px) {
      .desktop {
        display: none;
      }

      .mobile {
        display: block;
      }
    }
  </style>
</head>

<body>

  <div id="debug"></div>

  <h1 class="desktop">
    DESKTOP
  </h1>

  <h1 class="mobile">
    MOBILE
  </h1>

  <script>
    const debug = document.getElementById("debug");

    debug.innerHTML =
      "innerWidth: " + window.innerWidth +
      "<br>innerHeight: " + window.innerHeight +
      "<br>CSS mobile: " +
      window.matchMedia("(max-width: 768px)").matches +
      "<br>screen.width: " + screen.width +
      "<br>devicePixelRatio: " + window.devicePixelRatio;
  </script>

</body>
</html>
